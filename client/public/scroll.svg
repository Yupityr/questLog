<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Pixel parchment scroll -->
  <rect x="5" y="4" width="22" height="24" fill="#2b1b12"/>
  <rect x="4" y="5" width="24" height="22" fill="#6b3f22"/>
  <rect x="5" y="6" width="22" height="20" fill="#d6a85d"/>
  <rect x="6" y="7" width="20" height="18" fill="#f3d98b"/>

  <!-- Top rolled edge -->
  <rect x="6" y="3" width="20" height="2" fill="#2b1b12"/>
  <rect x="5" y="4" width="22" height="2" fill="#8a542c"/>
  <rect x="7" y="4" width="18" height="1" fill="#f0c978"/>
  <rect x="4" y="5" width="2" height="4" fill="#2b1b12"/>
  <rect x="26" y="5" width="2" height="4" fill="#2b1b12"/>

  <!-- Bottom rolled edge -->
  <rect x="6" y="27" width="20" height="2" fill="#2b1b12"/>
  <rect x="5" y="26" width="22" height="2" fill="#8a542c"/>
  <rect x="7" y="27" width="18" height="1" fill="#f0c978"/>
  <rect x="4" y="23" width="2" height="4" fill="#2b1b12"/>
  <rect x="26" y="23" width="2" height="4" fill="#2b1b12"/>

  <!-- Paper shading -->
  <rect x="6" y="7" width="2" height="18" fill="#c18b45"/>
  <rect x="24" y="7" width="2" height="18" fill="#d09a4d"/>
  <rect x="8" y="7" width="1" height="18" fill="#ffe8a3"/>

  <!-- Pixel writing -->
  <rect x="11" y="10" width="10" height="2" fill="#5a351e"/>
  <rect x="10" y="14" width="12" height="2" fill="#5a351e"/>
  <rect x="11" y="18" width="8" height="2" fill="#5a351e"/>
  <rect x="10" y="22" width="11" height="1" fill="#8a542c"/>
</svg>
